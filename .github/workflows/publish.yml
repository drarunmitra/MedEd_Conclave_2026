name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2
        # If you are not using renv, replace the step above with:
        # uses: r-lib/actions/setup-r-dependencies@v2
        # with:
        #   packages: |
        #     any::tidyverse
        #     any::gtsummary
        #     any::janitor
        #     any::knitr
        #     any::rmarkdown
        #     any::skimr
        #     any::patchwork
        #     any::flextable

      - name: Generate teaching datasets
        run: Rscript R/00_generate_datasets.R

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
