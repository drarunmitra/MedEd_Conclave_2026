name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        # Pinned to the version the site and the WebR primers were verified on
        # (docs/webr-verification-2026-08.md). The extension and _freeze cache
        # were built with it; a different CI version is an untested render.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.36

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # broom and broom.helpers are loaded by gtsummary at run time rather than
      # declared as hard dependencies, so setup-r-dependencies will not pull
      # them in on its own. Without broom.helpers the s7-gtsummary render dies
      # at tbl_regression() with 'The package "broom.helpers" is required'.
      # Do NOT put comments inside the packages block below: it is a literal
      # block scalar, so every line in it is handed to R as a package spec and
      # a '#' line fails the step with 'Error: unexpected symbol'.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::gtsummary
            any::broom
            any::broom.helpers
            any::janitor
            any::knitr
            any::rmarkdown
            any::skimr
            any::patchwork
            any::flextable
            any::scales
            any::here
            any::gt
            any::MASS

      - name: Generate teaching datasets
        run: Rscript R/00_generate_datasets.R

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
