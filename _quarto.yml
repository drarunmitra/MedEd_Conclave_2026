project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - "index.qmd"
    - "schedule.qmd"
    - "prelude/*.qmd"
    - "day1/*.qmd"
    - "day2/*.qmd"
    - "resources/*.qmd"
    - "slides/day1/*.qmd"
    - "slides/day2/*.qmd"
  resources:
    - "data/**"
    - "R/**"
    - "setup/**"
    - "admin/**"
    - "slides/workshop_intro.html"

website:
  title: "R & Reproducible Research"
  description: "MedEd Conclave 2026: a two-day hands-on workshop for medical education faculty and researchers."
  site-url: "https://drarunmitra.github.io/MedEd_Conclave_2026/"
  repo-url: "https://github.com/drarunmitra/MedEd_Conclave_2026"
  repo-actions: [issue]
  page-navigation: true
  back-to-top-navigation: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Prelude"
        href: prelude/index.qmd
      # - text: "Day 1"
      #   href: day1/index.qmd
      # - text: "Day 2"
      #   href: day2/index.qmd
      # - text: "Schedule"
      #   href: schedule.qmd
      - text: "Resources"
        href: resources/index.qmd
    right:
      - icon: github
        href: https://github.com/drarunmitra/MedEd_Conclave_2026
        aria-label: GitHub repository

  sidebar:
    - id: prelude
      title: "Prelude"
      style: floating
      collapse-level: 2
      contents:
        - prelude/index.qmd
        - prelude/install.qmd
        - prelude/check-setup.qmd
        - prelude/r-primer.qmd
        - section: "Interactive primers"
          contents:
            - prelude/primer-01-objects.qmd
            - prelude/primer-02-tibbles.qmd
            - prelude/primer-03-packages-pipe.qmd
            - prelude/primer-04-dplyr-verbs.qmd
            - prelude/primer-05-first-plot.qmd
        - prelude/pre-reading.qmd

