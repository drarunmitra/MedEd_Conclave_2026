  page-footer:
    background: light
    left: "MedEd Conclave 2026 · SET Team"
    center: "Materials licensed [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/); code [MIT](https://opensource.org/licenses/MIT)"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-link: true
    df-print: paged
    link-external-newwindow: true
    anchor-sections: true
    fig-align: center
    fig-width: 7
    fig-height: 4.5

execute:
  freeze: auto
  warning: false
  message: false
  echo: true

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    R.options:
      width: 76
